name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Cargo.toml
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não corresponde à versão ${VERSION} do Cargo.toml"
            exit 1
          fi

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empacotar
        shell: bash
        run: |
          NAME="sqlion-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          EXE=sqlion
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=sqlion.exe; fi
          cp "target/${{ matrix.target }}/release/$EXE" "dist/$NAME/"
          cp LICENSE README.md "dist/$NAME/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/sqlion-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publicar release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Código-fonte
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="sqlion-${VERSION}/" -o "dist/sqlion-${VERSION}-source.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="sqlion-${VERSION}/" -o "dist/sqlion-${VERSION}-source.zip" "$GITHUB_REF_NAME"

      - name: Checksums
        working-directory: dist
        run: sha256sum sqlion-* > SHA256SUMS

      - name: Criar o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Sqlion ${GITHUB_REF_NAME}" --generate-notes $PRE
