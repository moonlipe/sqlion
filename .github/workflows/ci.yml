name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Testes
        run: cargo test --locked
      - name: TLS legado (tiberius vendored, handshake TLS 1.0/1.1 contra OpenSSL local)
        run: cargo test --manifest-path vendor/tiberius/Cargo.toml --no-default-features --features tds73,rustls,legacy-openssl --lib legacy
      - name: Compilação
        run: cargo build --locked
      - name: Clippy (sem avisos)
        run: cargo clippy --locked --all-targets -- -D warnings
