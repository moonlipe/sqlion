[package]
name = "sqlion"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = "0.36"
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19"
mysql = { version = "25", default-features = false, features = ["minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
mongodb = { version = "3", default-features = false, features = ["sync", "rustls-tls", "compat-3-0-0", "dns-resolver"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
